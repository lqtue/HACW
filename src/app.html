<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" />
    <!-- iOS home-screen install: it ignores the manifest icons, needs this opaque PNG. -->
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e85f34" />
    <!-- iOS ignores the manifest's display:standalone; this is what hides Safari's chrome (incl. bottom bar) once added to home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS launch screens: one exact-size image per device, light+dark, else white flash.
         Generated by scripts/gen-splash.mjs — re-run it, then paste static/splash/links.html here. -->
    <link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/440x956@3-light.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/440x956@3-dark.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />

    <link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/360x780@3-dark.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <!-- App-wide title/description. Single-language (proper-noun event name); a 3-tab
         PWA doesn't need per-page titles. A route's own head tags still override these. -->
    <title>Xuyên Mạch Nghệ</title>
    <meta name="description" content="Khám phá, check-in và sưu tầm tem Tuần lễ Sáng tạo Hội An 2026" />
    <!-- Resolve theme before paint (no flash): stored choice, else follow the OS. -->
    <script>
      try {
        var t = localStorage.getItem('hacw_theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- Be Vietnam Pro is self-hosted in app.css: no third-party request left,
         so the app renders identically with the network off. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
