# Cloudflare Pages config. Keeps the D1 binding in the repo instead of clicked
# into the dashboard, so `npx wrangler pages deploy` and a Git-connected build
# both get it. Apply schema.sql to the database once: see README.
name = "hacw"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2026-07-26"
# SvelteKit's _worker.js imports node:async_hooks (AsyncLocalStorage).
compatibility_flags = ["nodejs_compat"]

# Production. Preview deploys get the same database on purpose — one event, one
# set of counters; a second D1 would split the dashboard numbers in half.
[[d1_databases]]
binding = "DB"
database_name = "hacw"
database_id = "ddef60b2-6aa9-45a6-a431-442b98a2ea52"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "hacw"
database_id = "ddef60b2-6aa9-45a6-a431-442b98a2ea52"

# Per-IP rate limit on /api/* lives as a Cloudflare dashboard rule, NOT here:
# Pages' wrangler-config validation rejects `[[unsafe.bindings]]`, and the
# ratelimit binding cannot be declared in wrangler.toml for a Pages project.
# src/hooks.server.js already no-ops when `platform.env.API_LIMITER` is absent,
# so the app is safe without it; the same-origin + 16 KB body guards in
# $lib/guard.js still run. Re-add the limiter as a WAF/rate-limit rule on the
# zone (or bind API_LIMITER in the dashboard) once on a custom domain.
